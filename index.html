<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanami 语音合成工具</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 20px; color: #1d1d1f; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 100px; resize: none; }
        button { width: 100%; padding: 12px; background-color: #0071e3; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0077ed; }
        .config-section { background: #fbfbfd; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h2>ja-JP-NanamiNeural</h2>
    
    <div class="config-section">
        <label>Azure 密钥 (Key 1)</label>
        <input type="password" id="azureKey" placeholder="请在此粘贴你的 Azure 密钥">
        
        <label>服务区域 (Region)</label>
        <select id="azureRegion">
            <option value="eastasia">东亚 (East Asia / 香港)</option>
            <option value="southeastasia">东南亚 (Southeast Asia / 新加坡)</option>
        </select>
    </div>

    <label>请输入要朗读的日语文本</label>
    <textarea id="textInput" placeholder="输入日语，例如：こんにちは、お疲れ様でした。"></textarea>
    
    <button id="playBtn">让 Nanami 说话</button>
</div>

<script>
    // 1. 页面加载时，自动从浏览器缓存里读取之前保存的 Key 和 区域
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("my_azure_key");
        const savedRegion = localStorage.getItem("my_azure_region");
        if (savedKey) document.getElementById("azureKey").value = savedKey;
        if (savedRegion) document.getElementById("azureRegion").value = savedRegion;
    });

    // 2. 点击播放按钮时的逻辑
    document.getElementById("playBtn").addEventListener("click", async () => {
        const key = document.getElementById("azureKey").value.trim();
        const region = document.getElementById("azureRegion").value;
        const text = document.getElementById("textInput").value.trim();

        if (!key || !text) {
            alert("请确保密钥和文本都已经填写！");
            return;
        }

        // 自动把这次输入的 Key 牢牢记住，下次打开网页就不用再输了
        localStorage.setItem("my_azure_key", key);
        localStorage.setItem("my_azure_region", region);

        // 动态构建官方接口网址
        const url = `https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`;

        // 组装标准的 SSML 格式数据
        const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='ja-JP'><voice name='ja-JP-NanamiNeural'>${text}</voice></speak>`;

        const btn = document.getElementById("playBtn");
        btn.innerText = "正在合成声音...";
        btn.disabled = true;

        try {
            // 发送正规的官方跨域请求
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/ssml+xml',
                    'X-Microsoft-OutputFormat': 'audio-16khz-128kbps-mono-mp3',
                    'User-Agent': 'Mozilla/5.0',
                    'Ocp-Apim-Subscription-Key': key
                },
                body: ssml
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`错误码: ${response.status}, 详情: ${errText}`);
            }

            // 拿到音频流并直接用浏览器自带的音频播放器播放
            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            const audio = new Audio(audioUrl);
            audio.play();

        } catch (error) {
            alert("请求失败，请检查密钥是否正确，或网络是否通畅。\n" + error.message);
        } finally {
            btn.innerText = "让 Nanami 说话";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
